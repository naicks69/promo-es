<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Ofertas | Promoções Imperdíveis</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-orange-500 to-amber-500 p-2.5 rounded-xl shadow-lg shadow-orange-500/20">
                    <i data-lucide="zap" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-orange-400 to-amber-200 bg-clip-text text-transparent">
                        RadarDeOfertas
                    </h1>
                    <p class="text-xs text-slate-400">Promoções verificadas em tempo real</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- Botão de Favoritos -->
                <button onclick="alternarAbaFavoritos()" id="btn-favoritos-topo" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold px-3 py-2.5 rounded-xl transition text-sm border border-slate-600">
                    <i data-lucide="heart" class="w-4 h-4 text-rose-400"></i>
                    <span class="hidden sm:inline">Favoritos</span>
                    <span id="contador-favoritos" class="bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
                </button>

                <!-- WhatsApp -->
                <a href="https://wa.me/" target="_blank" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2.5 rounded-xl transition shadow-lg shadow-emerald-600/30 text-sm">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    <span>Entrar no WhatsApp</span>
                </a>
            </div>
        </div>
    </header>

  <!-- HERO SECTION (COM DESTAQUE NAS CORES DAS LOJAS) -->
    <section class="bg-gradient-to-b from-slate-800/50 to-slate-900 border-b border-slate-800/80 py-12 px-4">
        <div class="max-w-3xl mx-auto text-center space-y-4">
            
            <!-- Badge Discreto -->
            <div>
                <span class="inline-flex items-center gap-1.5 py-1 px-3.5 rounded-full text-xs font-medium bg-slate-800 text-orange-400 border border-slate-700/80 shadow-sm">
                    <i data-lucide="flame" class="w-3.5 h-3.5 text-orange-400"></i>
                    <span>Monitoramento em tempo real</span>
                </span>
            </div>

            <!-- Título Principal com Destaque nas Cores das Lojas -->
            <h2 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight">
                As melhores ofertas da 
                <span class="text-[#FF9900]">Amazon</span>, 
                <span class="text-[#EE4D2D]">Shopee</span> e 
                <span class="text-[#FFE600]">Mercado Livre</span>
            </h2>

            <!-- Subtítulo Suave -->
            <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto font-normal leading-relaxed">
                Acompanhe em tempo real as maiores promoções verificadas e economize nas suas compras.
            </p>

        </div>
    </section>

    <!-- BARRA DE FILTROS COM MENUS SELECT -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            
            <!-- 1. Campo de Busca -->
            <div class="relative w-full">
                <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="input-busca" onkeyup="aplicarFiltros()" placeholder="Buscar produto..." 
                       class="w-full bg-slate-800 border border-slate-700 text-slate-200 placeholder-slate-400 text-sm rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-orange-500 transition">
            </div>

            <!-- 2. Select de Categorias -->
            <div class="w-full">
                <select id="select-categoria" onchange="aplicarFiltros()" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition cursor-pointer">
                    <option value="todas">📦 Todas as Categorias</option>
                    <option value="eletronicos">📱 Eletrônicos</option>
                    <option value="gamer">🎮 Gamer</option>
                    <option value="moda">👕 Moda</option>
                </select>
            </div>

            <!-- 3. Select de Lojas -->
            <div class="w-full">
                <select id="select-loja" onchange="aplicarFiltros()" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition cursor-pointer">
                    <option value="todas">🏪 Todas as Lojas</option>
                    <option value="amazon">Amazon</option>
                    <option value="shopee">Shopee</option>
                    <option value="mercadolivre">Mercado Livre</option>
                </select>
            </div>

            <!-- 4. Select de Ordenação de Preço -->
            <div class="w-full">
                <select id="select-ordenar" onchange="aplicarFiltros()" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition cursor-pointer">
                    <option value="recentes">🔥 Mais Recentes</option>
                    <option value="menor-preco">📉 Menor Preço</option>
                    <option value="maior-preco">📈 Maior Preço</option>
                </select>
            </div>

        </div>

        <!-- GRELHA DE PRODUTOS -->
        <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </section>

    <!-- FOOTER -->
    <footer class="mt-auto bg-slate-800 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 RadarDeOfertas - Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT DE FUNCIONALIDADES -->
    <script>
        let todosOsProdutos = [];
        let apenasFavoritos = false;
        let favoritos = JSON.parse(localStorage.getItem('favoritos') || '[]');

        async function carregarOfertas() {
            try {
                const resposta = await fetch('/api/ofertas');
                todosOsProdutos = await resposta.json();
                aplicarFiltros();
                atualizarContadorFavoritos();
            } catch (erro) {
                console.error("Erro ao carregar ofertas:", erro);
            }
        }

        function aplicarFiltros() {
            let lista = [...todosOsProdutos];
            const texto = document.getElementById('input-busca').value.toLowerCase();
            const categoriaSelecionada = document.getElementById('select-categoria').value;
            const lojaSelecionada = document.getElementById('select-loja').value;
            const ordenacao = document.getElementById('select-ordenar').value;

            // Filtro por texto
            if (texto) {
                lista = lista.filter(p => p.titulo.toLowerCase().includes(texto));
            }

            // Filtro por categoria
            if (categoriaSelecionada !== 'todas') {
                lista = lista.filter(p => p.categoria === categoriaSelecionada);
            }

            // Filtro por loja
            if (lojaSelecionada !== 'todas') {
                lista = lista.filter(p => p.loja === lojaSelecionada);
            }

            // Filtro por favoritos
            if (apenasFavoritos) {
                lista = lista.filter(p => favoritos.includes(p.id));
            }

            // Ordenação
            if (ordenacao === 'menor-preco') {
                lista.sort((a, b) => a.preco - b.preco);
            } else if (ordenacao === 'maior-preco') {
                lista.sort((a, b) => b.preco - a.preco);
            }

            renderizarProdutos(lista);
        }

        function renderizarProdutos(lista) {
            const grid = document.getElementById('grid-produtos');
            grid.innerHTML = '';

            if (lista.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-500">
                        <i data-lucide="package-x" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                        <p>Nenhuma promoção encontrada com os filtros selecionados.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            lista.forEach(produto => {
                const isFav = favoritos.includes(produto.id);
                const card = `
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-slate-600 transition shadow-lg group">
                        <div>
                            <!-- Imagem e Botão Favorito -->
                            <div class="relative h-48 bg-slate-900 overflow-hidden">
                                <img src="${produto.imagem || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80'}" alt="${produto.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <button onclick="toggleFavorito('${produto.id}')" class="absolute top-3 right-3 bg-slate-900/80 hover:bg-slate-900 p-2 rounded-xl backdrop-blur-sm transition border border-slate-700">
                                    <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'text-rose-500 fill-rose-500' : 'text-slate-300'}"></i>
                                </button>
                                <span class="absolute bottom-3 left-3 bg-slate-900/80 backdrop-blur-sm text-slate-200 text-[10px] font-bold uppercase px-2.5 py-1 rounded-lg border border-slate-700">
                                    ${produto.loja || 'loja'}
                                </span>
                            </div>

                            <div class="p-5">
                                <div class="mb-2">
                                    <span class="text-orange-400 text-[10px] font-bold uppercase tracking-wider">${produto.categoria}</span>
                                </div>
                                <h3 class="font-semibold text-slate-200 group-hover:text-orange-400 transition text-sm sm:text-base line-clamp-2 mb-4">
                                    ${produto.titulo}
                                </h3>
                            </div>
                        </div>

                        <div class="p-5 pt-0">
                            <div class="mb-4 flex items-baseline justify-between">
                                <div>
                                    <span class="text-[10px] text-slate-400 block">Por apenas</span>
                                    <div class="text-2xl font-black text-emerald-400 tracking-tight">
                                        R$ ${produto.preco.toFixed(2).replace('.', ',')}
                                    </div>
                                </div>
                                <button onclick="copiarLink('${produto.link}')" title="Copiar link" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl transition border border-slate-700">
                                    <i data-lucide="copy" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <a href="${produto.link}" target="_blank" 
                               class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-orange-500/20 transition text-sm">
                                <span>Ver na Loja</span>
                                <i data-lucide="external-link" class="w-4 h-4"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            lucide.createIcons();
        }

        function toggleFavorito(id) {
            if (favoritos.includes(id)) {
                favoritos = favoritos.filter(f => f !== id);
            } else {
                favoritos.push(id);
            }
            localStorage.setItem('favoritos', JSON.stringify(favoritos));
            atualizarContadorFavoritos();
            aplicarFiltros();
        }

        function alternarAbaFavoritos() {
            apenasFavoritos = !apenasFavoritos;
            const btn = document.getElementById('btn-favoritos-topo');
            if (apenasFavoritos) {
                btn.classList.add('border-rose-500', 'bg-rose-500/10');
            } else {
                btn.classList.remove('border-rose-500', 'bg-rose-500/10');
            }
            aplicarFiltros();
        }

        function atualizarContadorFavoritos() {
            document.getElementById('contador-favoritos').innerText = favoritos.length;
        }

        function copiarLink(link) {
            navigator.clipboard.writeText(link);
            alert('Link de afiliado copiado!');
        }

        // ==========================================
        // CORREÇÃO: Executa o Lucide assim que o HTML abre
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            carregarOfertas();
        });

        // Inicia assim que a página é carregada
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            carregarOfertas();

            // ATUALIZAÇÃO AUTOMÁTICA DA TELA:
            // Faz o site buscar novas ofertas da API a cada 30 segundos sozinho!
            setInterval(() => {
                carregarOfertas();
            }, 30000); 
        });
        
    </script>
</body>
</html>
